<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d1a">
<title>Fio Fresbee</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    background:#0d0d1a;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; font-family:'Courier New', monospace; color:#fff;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  h1 {
    font-size:clamp(18px,4vw,32px); letter-spacing:4px; margin:10px 0 4px;
    color:#ffd23f; text-shadow:3px 3px 0 #d14b1f, 6px 6px 0 rgba(0,0,0,.4);
    text-transform:uppercase;
  }
  .sub { color:#7ec8e3; font-size:12px; letter-spacing:2px; margin-bottom:10px; }
  #wrap { position:relative; line-height:0; }
  canvas {
    border:4px solid #2a2a4a; border-radius:8px;
    box-shadow:0 0 40px rgba(255,210,63,.15);
    image-rendering:pixelated;
    background:#87ceeb;
    max-width:96vw; max-height:70vh;
  }
  #help { margin-top:10px; font-size:12px; color:#aaa; letter-spacing:1px; text-align:center; line-height:1.7; }
  #help b { color:#ffd23f; }

  /* ---- pulsante schermo intero ---- */
  #fsBtn {
    position:absolute; top:12px; right:12px; z-index:60;
    width:44px; height:44px; border-radius:10px;
    border:2px solid #ffd23f; background:rgba(26,26,51,.75);
    color:#ffd23f; font-size:20px; cursor:pointer; line-height:1;
  }
  #fsBtn:hover { background:#1a1a33; }

  /* ---- controlli touch sovrapposti al canvas ---- */
  .pad { display:none; position:absolute; bottom:14px; z-index:55; gap:14px; }
  #padL { left:14px; }
  #padR { right:14px; }
  .pad button {
    width:64px; height:64px; border-radius:50%; border:3px solid #ffd23f;
    background:rgba(26,26,51,.55); color:#ffd23f; font-size:24px;
    touch-action:none; -webkit-tap-highlight-color:transparent;
  }
  @media (pointer:coarse) { .pad { display:flex; } }

  /* ---- modalità schermo intero (vera o simulata su iPhone) ---- */
  body.fs { overflow:hidden; }
  body.fs h1, body.fs .sub, body.fs #help { display:none; }
  body.fs #wrap, #wrap:fullscreen, #wrap:-webkit-full-screen {
    position:fixed; inset:0; width:100vw; height:100vh; z-index:50;
    background:#0d0d1a;
    display:flex; align-items:center; justify-content:center;
  }
  body.fs canvas, #wrap:fullscreen canvas, #wrap:-webkit-full-screen canvas {
    border:none; border-radius:0; box-shadow:none;
    width:min(100vw, calc(100vh * 16 / 9));
    height:min(100vh, calc(100vw * 9 / 16));
    max-width:100vw; max-height:100vh;
  }

  /* ---- inserimento nome record ---- */
  #nameBox {
    display:none; position:absolute; z-index:70;
    left:50%; top:50%; transform:translate(-50%,-50%);
    background:#1a1a33; border:3px solid #ffd23f; border-radius:12px;
    padding:22px 26px; text-align:center; line-height:1.6;
    box-shadow:0 0 60px rgba(0,0,0,.7);
  }
  #nameBox .t { color:#ffd23f; font-weight:bold; font-size:20px; letter-spacing:2px; margin-bottom:10px; }
  #nameInput {
    width:180px; padding:8px; font-family:inherit; font-size:18px; text-align:center;
    text-transform:uppercase; background:#0d0d1a; color:#fff;
    border:2px solid #7ec8e3; border-radius:6px; outline:none;
  }
  #nameOk {
    display:block; margin:12px auto 0; padding:8px 26px;
    font-family:inherit; font-size:16px; font-weight:bold; letter-spacing:2px;
    background:#ffd23f; color:#1a1a33; border:none; border-radius:6px; cursor:pointer;
  }
</style>
</head>
<body>
<h1>Fio Fresbee</h1>
<div class="sub">IL CANE PIÙ VELOCE DELLA SPIAGGIA</div>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <button id="fsBtn" title="Schermo intero">⛶</button>
  <div class="pad" id="padL">
    <button id="btnL">◀</button>
    <button id="btnR">▶</button>
  </div>
  <div class="pad" id="padR">
    <button id="btnJ">▲</button>
  </div>
  <div id="nameBox">
    <div class="t">NUOVO RECORD!</div>
    <input id="nameInput" maxlength="10" placeholder="IL TUO NOME" autocomplete="off">
    <button id="nameOk">OK</button>
  </div>
</div>
<div id="help">
  <b>← →</b> muovi il cane · <b>SPAZIO / ↑</b> salto acrobatico · prendi il frisbee al volo!<br>
  Prese in salto = punti bonus · frisbee <b>DORATO</b> = 500 punti! · <b>INVIO</b> per iniziare · <b>M</b> musica on/off · <b>⛶</b> schermo intero
</div>

<script>
// ================= CONFIGURAZIONE CLASSIFICA ONLINE (SUPABASE) =================
// Incolla qui i due valori del tuo progetto Supabase (vedi GUIDA.md).
// Finché restano vuoti, la classifica funziona solo in locale sul dispositivo.
const SUPA_URL = 'https://gynxolpcxgkcuygsamgc.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5bnhvbHBjeGdrY3V5Z3NhbWdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMzU3NTIsImV4cCI6MjEwMjYxMTc1Mn0.K_Ecdzd_aJR8CJAYT5vUbyU6A9vpMIQj1G7aAy5Wrcg';
// ===============================================================================
const ONLINE = SUPA_URL.startsWith('https') && SUPA_KEY.length > 20;
const SUPA_HEADERS = {
  'apikey': SUPA_KEY,
  'Authorization': 'Bearer ' + SUPA_KEY,
  'Content-Type': 'application/json'
};

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const GROUND = H - 90;

// ---------- STATE ----------
let state = 'title'; // title, play, over
let score = 0, best = +(localStorage.getItem('dd_best')||0);
let catches = 0, round = 0, misses = 0;
const MAX_MISS = 3;
let message = '', msgTimer = 0;
let particles = [];
let clouds = [];
for (let i=0;i<4;i++) clouds.push({x:Math.random()*W, y:30+Math.random()*90, s:.5+Math.random()});

// barchette a vela
let boats = [], boatTimer = 0;
function spawnBoat(){
  const dir = Math.random() < 0.5 ? 1 : -1;
  boats.push({
    x: dir > 0 ? -70 : W+70,
    y: GROUND - 34 + Math.random()*24,
    vx: dir * (0.4 + Math.random()*0.7),
    s: 0.6 + Math.random()*0.6,
    hue: Math.floor(Math.random()*360),
    bob: Math.random()*Math.PI*2
  });
}

// ---------- CLASSIFICA (online via Supabase, altrimenti locale) ----------
let board = [];
let boardLoading = false;
let nameOpen = false;
try { board = JSON.parse(localStorage.getItem('dd_board')||'[]'); } catch(e){ board=[]; }
function saveLocalBoard(){ localStorage.setItem('dd_board', JSON.stringify(board.slice(0,5))); }

async function fetchBoard(){
  if (!ONLINE) return;
  boardLoading = true;
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/scores?select=name,score&order=score.desc&limit=5', { headers: SUPA_HEADERS });
    if (r.ok) board = await r.json();
  } catch(e){}
  boardLoading = false;
}

async function submitScore(name, s){
  if (!ONLINE){
    board.push({name, score:s});
    board.sort((a,b)=>b.score-a.score);
    board = board.slice(0,5);
    saveLocalBoard();
    return;
  }
  try {
    await fetch(SUPA_URL + '/rest/v1/scores', {
      method:'POST', headers: SUPA_HEADERS,
      body: JSON.stringify({ name, score: s })
    });
  } catch(e){}
  await fetchBoard();
}

function qualifies(s){ return s>0 && (board.length<5 || s > board[board.length-1].score); }

const nameBox = document.getElementById('nameBox');
const nameInput = document.getElementById('nameInput');
function askName(){
  nameOpen = true;
  nameInput.value = localStorage.getItem('dd_name') || '';
  nameBox.style.display = 'block';
  setTimeout(()=>nameInput.focus(), 50);
}
function confirmName(){
  let name = (nameInput.value||'PLAYER').toUpperCase().replace(/[^A-Z0-9 ]/g,'').slice(0,10).trim() || 'PLAYER';
  localStorage.setItem('dd_name', name);
  nameBox.style.display = 'none';
  nameOpen = false;
  submitScore(name, score);
}
document.getElementById('nameOk').addEventListener('click', confirmName);
nameInput.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') confirmName();
});

// ---------- SCHERMO INTERO ----------
const wrap = document.getElementById('wrap');
function isFS(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement) || document.body.classList.contains('fs-sim');
}
function toggleFS(){
  if (!isFS()){
    if (wrap.requestFullscreen) wrap.requestFullscreen().catch(()=>simFS());
    else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
    else simFS(); // iPhone: niente API fullscreen → modalità simulata
  } else {
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
    document.body.classList.remove('fs','fs-sim');
  }
}
function simFS(){
  document.body.classList.add('fs','fs-sim');
  window.scrollTo(0,1);
}
function syncFSClass(){
  const real = !!(document.fullscreenElement || document.webkitFullscreenElement);
  if (real) document.body.classList.add('fs');
  else if (!document.body.classList.contains('fs-sim')) document.body.classList.remove('fs');
  document.getElementById('fsBtn').textContent = isFS() ? '✕' : '⛶';
}
document.addEventListener('fullscreenchange', syncFSClass);
document.addEventListener('webkitfullscreenchange', syncFSClass);
document.getElementById('fsBtn').addEventListener('click', e => { e.stopPropagation(); toggleFS(); syncFSClass(); });

// classifica (top 5)
// thrower (the player character) on the left
const thrower = { x: 120, y: GROUND };

// dog
const dog = {
  x: W*0.55, y: GROUND, vx: 0, vy: 0,
  w: 54, h: 34, onGround: true, dir: 1, jumpSpin: 0, anim: 0
};

// frisbee
const disc = {
  active: false, x:0, y:0, vx:0, vy:0,
  curve:0, rot:0, trail:[], bounces:0, gold:false
};

// ---------- AUDIO (chiptune via Web Audio) ----------
let AC = null, musicOn = true, musicTimer = null;
function audio(){
  if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(freq, dur, type='square', vol=0.15, slide=0, delay=0){
  try {
    const ac = audio();
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq+slide), t+dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t+dur+0.02);
  } catch(e){}
}
function noiseBurst(dur=0.15, vol=0.12, delay=0){
  try {
    const ac = audio();
    const t = ac.currentTime + delay;
    const buf = ac.createBuffer(1, ac.sampleRate*dur, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1-i/d.length);
    const s = ac.createBufferSource(); s.buffer = buf;
    const g = ac.createGain(); g.gain.value = vol;
    const f = ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200;
    s.connect(f).connect(g).connect(ac.destination);
    s.start(t);
  } catch(e){}
}
const SFX = {
  throw_(){ noiseBurst(0.25, 0.10); beep(300, 0.25, 'sawtooth', 0.06, 500); },
  jump(){ beep(250, 0.18, 'square', 0.10, 350); },
  catch_(){ beep(660, 0.10, 'square', 0.14); beep(880, 0.16, 'square', 0.14, 0, 0.09); },
  acro(){ [523,659,784,1046].forEach((f,i)=>beep(f, 0.12, 'square', 0.14, 0, i*0.07)); },
  bounce(){ beep(180, 0.08, 'triangle', 0.10, -60); },
  miss(){ beep(300, 0.5, 'sawtooth', 0.12, -220); },
  round(){ beep(440,0.1,'square',0.12); beep(660,0.15,'square',0.12,0,0.1); },
  goldSpawn(){ [880,1108,1318].forEach((f,i)=>beep(f, 0.10, 'triangle', 0.12, 0, i*0.06)); },
  golden(){ [523,659,784,1046,1318,1568].forEach((f,i)=>beep(f, 0.14, 'square', 0.14, 0, i*0.07)); beep(2093, 0.4, 'triangle', 0.10, 0, 0.45); },
  over(){ [392,330,262,196].forEach((f,i)=>beep(f, 0.25, 'square', 0.13, 0, i*0.18)); }
};
// musichetta loop (marimba-ish da spiaggia)
const MELODY = [523,0,659,784, 659,0,523,392, 440,0,523,659, 587,659,784,0];
const BASS   = [131,0,131,0, 165,0,165,0, 110,0,110,0, 147,0,196,0];
let mStep = 0;
function musicTick(){
  if (!musicOn || state!=='play') return;
  const m = MELODY[mStep%16], b = BASS[mStep%16];
  if (m) beep(m, 0.16, 'triangle', 0.05);
  if (b) beep(b, 0.20, 'sine', 0.06);
  mStep++;
}
function startMusic(){
  stopMusic();
  musicTimer = setInterval(musicTick, 190);
}
function stopMusic(){ if (musicTimer){ clearInterval(musicTimer); musicTimer=null; } }

const keys = {};
addEventListener('keydown', e => {
  if (nameOpen) return;
  keys[e.code] = true;
  if (e.code === 'Enter') {
    if (state === 'title' || state === 'over') startGame();
  }
  if (e.code === 'KeyM') musicOn = !musicOn;
  if (e.code === 'KeyF') { toggleFS(); syncFSClass(); }
  if (['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);

// touch controls
const bind = (id, code) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); keys[code]=true;
    if (state!=='play' && !nameOpen) startGame(); }, {passive:false});
  el.addEventListener('touchend', e => { e.preventDefault(); keys[code]=false; }, {passive:false});
  el.addEventListener('touchcancel', e => { keys[code]=false; });
};
bind('btnL','ArrowLeft'); bind('btnR','ArrowRight'); bind('btnJ','Space');
cv.addEventListener('touchstart', e => { if (state!=='play' && !nameOpen) startGame(); }, {passive:true});

function startGame(){
  state='play'; score=0; catches=0; round=0; misses=0;
  dog.x=W*0.55; dog.y=GROUND; dog.vx=0; dog.vy=0;
  disc.active=false;
  setMessage('ROUND 1', 90);
  audio(); SFX.round(); startMusic();
  setTimeout(launchDisc, 900);
}

function setMessage(t, frames){ message=t; msgTimer=frames; }

// ---------- FRISBEE LAUNCH ----------
function launchDisc(){
  if (state!=='play') return;
  round++;
  const power = Math.min(1, 0.55 + round*0.06);           // gets harder
  disc.active = true;
  disc.x = thrower.x + 30; disc.y = thrower.y - 60;
  disc.vx = 5 + Math.random()*4*power + round*0.25;
  disc.vy = -(7 + Math.random()*5);
  disc.curve = (Math.random()*2-1) * (1.5 + round*0.2);   // curva!
  disc.rot = 0; disc.trail = []; disc.bounces = 0;
  disc.gold = Math.random() < 0.08;   // raro: ~1 lancio su 12
  SFX.throw_();
  if (disc.gold) SFX.goldSpawn();
}

// ---------- PHYSICS ----------
function update(){
  // barchette (anche nei menu, fanno scena)
  boatTimer--;
  if (boatTimer <= 0 && boats.length < 3){ spawnBoat(); boatTimer = 300 + Math.random()*500; }
  boats.forEach(b => { b.x += b.vx; b.bob += 0.03; });
  boats = boats.filter(b => b.x > -90 && b.x < W+90);

  if (state !== 'play') return;

  // dog movement
  const SPEED = 5.2;
  dog.vx = 0;
  if (keys['ArrowLeft'])  { dog.vx = -SPEED; dog.dir = -1; }
  if (keys['ArrowRight']) { dog.vx =  SPEED; dog.dir =  1; }
  if ((keys['Space']||keys['ArrowUp']) && dog.onGround){
    dog.vy = -12.5; dog.onGround = false; dog.jumpSpin = 0;
    SFX.jump();
  }
  dog.x += dog.vx;
  dog.vy += 0.55;
  dog.y += dog.vy;
  if (dog.y >= GROUND){ dog.y = GROUND; dog.vy = 0; dog.onGround = true; dog.jumpSpin = 0; }
  if (!dog.onGround) dog.jumpSpin += 0.25;
  dog.x = Math.max(20, Math.min(W-20, dog.x));
  dog.anim += Math.abs(dog.vx)*0.08 + 0.02;

  // disc
  if (disc.active){
    disc.trail.push({x:disc.x, y:disc.y});
    if (disc.trail.length > 18) disc.trail.shift();
    disc.vy += 0.32;
    disc.vx += disc.curve * 0.02;                 // curva in volo
    disc.vx *= 0.999;
    disc.x += disc.vx;
    disc.y += disc.vy;
    disc.rot += 0.35;

    // scia scintillante del frisbee dorato
    if (disc.gold && Math.random() < 0.35){
      particles.push({
        x: disc.x + (Math.random()*2-1)*10, y: disc.y + (Math.random()*2-1)*6,
        vx:(Math.random()*2-1)*0.8, vy:-Math.random()*0.8,
        life: 15+Math.random()*15, color: Math.random()<0.5 ? '#ffd23f' : '#fff7d0'
      });
    }

    // ground bounce (max 2, then it's a miss when it stops/offscreen)
    if (disc.y > GROUND + 8 && disc.vy > 0){
      disc.y = GROUND + 8;
      disc.vy *= -0.55;
      disc.vx *= 0.75;
      disc.bounces++;
      SFX.bounce();
      puff(disc.x, GROUND+10, '#e8d8a0', 6);
    }

    // catch check: dog mouth zone
    const mouthX = dog.x + dog.dir*22, mouthY = dog.y - 26;
    const dx = disc.x - mouthX, dy = disc.y - mouthY;
    if (Math.hypot(dx,dy) < 34){
      const air = !dog.onGround;
      const spinBonus = Math.floor(dog.jumpSpin / (Math.PI*2));
      let pts = 100;
      if (air) pts = 250 + spinBonus*150;
      if (disc.gold){
        pts = 500 + (air ? spinBonus*150 : 0);
        setMessage(`GOLDEN! +${pts}`, 80);
        SFX.golden();
        puff(disc.x, disc.y, '#ffd23f', 30);
        puff(disc.x, disc.y, '#fff7d0', 15);
      } else {
        setMessage(air ? `ACROBATIC! +${pts}` : `+${pts}`, 60);
        air ? SFX.acro() : SFX.catch_();
        puff(disc.x, disc.y, air ? '#ffd23f' : '#7ec8e3', air?20:10);
      }
      score += pts; catches++;
      disc.active = false;
      setTimeout(launchDisc, 800);
    }

    // miss: offscreen or stopped bouncing
    if (disc.x > W+40 || disc.x < -40 || (disc.bounces >= 2 && disc.vy > -1 && disc.y >= GROUND+7)){
      disc.active = false;
      misses++;
      setMessage('MISS!', 60);
      if (misses >= MAX_MISS){
        state = 'over';
        stopMusic(); SFX.over();
        if (score > best){ best = score; localStorage.setItem('dd_best', best); }
        if (qualifies(score)) askName();
      } else {
        SFX.miss();
        setTimeout(launchDisc, 900);
      }
    }
  }

  // particles
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--; });

  clouds.forEach(c => { c.x += 0.15*c.s; if (c.x > W+80) c.x = -80; });
  if (msgTimer > 0) msgTimer--;
}

function puff(x,y,color,n){
  for (let i=0;i<n;i++) particles.push({
    x, y, vx:(Math.random()*2-1)*3, vy:-Math.random()*3,
    life: 20+Math.random()*20, color
  });
}

// ---------- DRAWING ----------
function draw(){
  // sky
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#4aa3df'); sky.addColorStop(0.6,'#87ceeb'); sky.addColorStop(1,'#c9ecff');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

  // sun
  ctx.fillStyle = '#ffe98a';
  ctx.beginPath(); ctx.arc(W-110, 80, 42, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,233,138,.35)';
  ctx.beginPath(); ctx.arc(W-110, 80, 60, 0, Math.PI*2); ctx.fill();

  // clouds
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  clouds.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, 22*c.s, 0, Math.PI*2);
    ctx.arc(c.x+24*c.s, c.y+4, 17*c.s, 0, Math.PI*2);
    ctx.arc(c.x-24*c.s, c.y+6, 15*c.s, 0, Math.PI*2);
    ctx.fill();
  });

  // sea strip
  ctx.fillStyle = '#3f8fc9'; ctx.fillRect(0, GROUND-46, W, 46);
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  for (let i=0;i<10;i++){
    const wx = (i*110 + (performance.now()/40 % 110));
    ctx.fillRect(wx, GROUND-40+(i%3)*14, 40, 3);
  }

  // barchette a vela
  boats.forEach(drawBoat);

  // sand
  ctx.fillStyle = '#f0dfa8'; ctx.fillRect(0, GROUND, W, H-GROUND);
  ctx.fillStyle = '#e2cd8a';
  for (let i=0;i<25;i++) ctx.fillRect((i*97)%W, GROUND+15+(i*37)%(H-GROUND-20), 8, 3);

  drawThrower();
  if (disc.active) drawDisc();
  drawDog();

  // particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life/30;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-2, p.y-2, 5, 5);
  });
  ctx.globalAlpha = 1;

  // HUD
  ctx.textAlign = 'left';
  ctx.font = 'bold 22px "Courier New"';
  ctx.fillStyle = '#000'; ctx.fillText('SCORE ' + score, 18, 35);
  ctx.fillStyle = '#ffd23f'; ctx.fillText('SCORE ' + score, 16, 33);
  ctx.fillStyle = '#000'; ctx.fillText('BEST ' + best, 18, 62);
  ctx.fillStyle = '#7ec8e3'; ctx.fillText('BEST ' + best, 16, 60);

  // misses (frisbee icons)
  ctx.textAlign = 'right';
  ctx.font = 'bold 20px "Courier New"';
  ctx.fillStyle = '#ff5a5a';
  ctx.fillText('MISS ' + misses + '/' + MAX_MISS, W-72, 33);

  // center message
  if (msgTimer > 0){
    ctx.textAlign = 'center';
    ctx.font = 'bold 44px "Courier New"';
    ctx.fillStyle = '#000';
    ctx.fillText(message, W/2+3, 163);
    ctx.fillStyle = '#ffd23f';
    ctx.fillText(message, W/2, 160);
  }

  if (state === 'title'){
    overlay('FIO FRESBEE', 'Premi INVIO o tocca per giocare', 'Guida Fio e prendi il fresbee al volo!');
    drawBoard(W/2, H/2+85);
  }
  if (state === 'over'){
    overlay('GAME OVER', `Punteggio: ${score} · Prese: ${catches}/${round}`, 'INVIO o tocca per ricominciare');
    drawBoard(W/2, H/2+85);
  }
}

function overlay(t1, t2, t3){
  ctx.fillStyle = 'rgba(10,10,30,.72)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 56px "Courier New"';
  ctx.fillStyle = '#000'; ctx.fillText(t1, W/2+4, H/2-34);
  ctx.fillStyle = '#ffd23f'; ctx.fillText(t1, W/2, H/2-38);
  ctx.font = 'bold 24px "Courier New"';
  ctx.fillStyle = '#fff'; ctx.fillText(t2, W/2, H/2+12);
  ctx.font = '18px "Courier New"';
  ctx.fillStyle = '#7ec8e3'; ctx.fillText(t3, W/2, H/2+50);
}

function drawBoat(b){
  ctx.save();
  ctx.translate(b.x, b.y + Math.sin(b.bob)*2.5);
  ctx.scale(b.s * (b.vx>0?1:-1), b.s);
  ctx.rotate(Math.sin(b.bob)*0.04);
  // scafo
  ctx.fillStyle = '#7a4a22';
  ctx.beginPath();
  ctx.moveTo(-26,0); ctx.lineTo(26,0); ctx.lineTo(16,12); ctx.lineTo(-16,12);
  ctx.closePath(); ctx.fill();
  // albero
  ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-34); ctx.stroke();
  // vela principale colorata
  ctx.fillStyle = `hsl(${b.hue},70%,65%)`;
  ctx.beginPath(); ctx.moveTo(2,-32); ctx.lineTo(2,-2); ctx.lineTo(22,-2);
  ctx.closePath(); ctx.fill();
  // veletta bianca
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(-2,-30); ctx.lineTo(-2,-2); ctx.lineTo(-16,-2);
  ctx.closePath(); ctx.fill();
  // bandierina
  ctx.fillStyle = '#ff5a5a';
  ctx.beginPath(); ctx.moveTo(0,-34); ctx.lineTo(10,-31); ctx.lineTo(0,-28);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawBoard(cx, top){
  ctx.textAlign = 'center';
  ctx.font = 'bold 22px "Courier New"';
  ctx.fillStyle = '#ffd23f';
  ctx.fillText(ONLINE ? '— CLASSIFICA ONLINE —' : '— CLASSIFICA —', cx, top);
  ctx.font = '18px "Courier New"';
  if (boardLoading && !board.length){
    ctx.fillStyle = '#7ec8e3';
    ctx.fillText('Caricamento...', cx, top+30);
    return;
  }
  if (!board.length){
    ctx.fillStyle = '#7ec8e3';
    ctx.fillText('Nessun record... ancora!', cx, top+30);
    return;
  }
  board.forEach((e,i) => {
    ctx.fillStyle = i===0 ? '#ffd23f' : '#fff';
    ctx.fillText(`${i+1}. ${e.name}  ${e.score}`, cx, top+30+i*24);
  });
}

function drawThrower(){
  const x = thrower.x, y = thrower.y;
  ctx.save(); ctx.translate(x, y);
  // legs
  ctx.fillStyle = '#22337a'; ctx.fillRect(-10,-30,9,30); ctx.fillRect(4,-30,9,30);
  // body (red jersey like Windjammers)
  ctx.fillStyle = '#d1342c'; ctx.fillRect(-13,-62,28,34);
  // head
  ctx.fillStyle = '#f0c08a'; ctx.fillRect(-9,-80,18,18);
  // bandana
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(-10,-82,20,7);
  // arm with disc (when not active, ready pose)
  if (!disc.active && state==='play'){
    ctx.fillStyle = '#f0c08a'; ctx.fillRect(12,-70,18,7);
    ctx.fillStyle = '#ff5a5a';
    ctx.beginPath(); ctx.ellipse(34,-67,12,4,0,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawDisc(){
  const main = disc.gold ? '#ffc400' : '#ff5a5a';
  const top  = disc.gold ? '#fff2b0' : '#ffd0d0';
  // trail
  disc.trail.forEach((t,i) => {
    ctx.globalAlpha = i/disc.trail.length * (disc.gold ? 0.5 : 0.35);
    ctx.fillStyle = main;
    ctx.beginPath(); ctx.ellipse(t.x, t.y, 12, 4, 0, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.save(); ctx.translate(disc.x, disc.y); ctx.rotate(Math.sin(disc.rot)*0.3);
  // alone luminoso pulsante per quello dorato
  if (disc.gold){
    ctx.fillStyle = 'rgba(255,215,80,' + (0.25 + Math.sin(disc.rot*2)*0.12) + ')';
    ctx.beginPath(); ctx.ellipse(0,0,24,10,0,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = main;
  ctx.beginPath(); ctx.ellipse(0,0,15,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = top;
  ctx.beginPath(); ctx.ellipse(0,-1.5,9,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawDog(){
  const x = dog.x, y = dog.y;
  ctx.save(); ctx.translate(x, y);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  const sh = Math.max(0.3, 1 - (GROUND-y)/300);
  ctx.beginPath(); ctx.ellipse(0, 6, 30*sh, 6*sh, 0, 0, Math.PI*2); ctx.fill();
  if (!dog.onGround) ctx.rotate(Math.sin(dog.jumpSpin)*0.35 * dog.dir);
  ctx.scale(dog.dir, 1);
  const run = Math.sin(dog.anim*6)*6;
  // tail
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-24,-26);
  ctx.quadraticCurveTo(-36,-38-run*0.5, -40,-30-run); ctx.stroke();
  // body
  ctx.fillStyle = '#b5763a';
  ctx.fillRect(-24,-38,48,22);
  // legs
  ctx.fillStyle = '#8a5a2a';
  const lo = dog.onGround ? run : 4;
  ctx.fillRect(-20,-18,7,18+lo*0.4);
  ctx.fillRect(-8,-18,7,18-lo*0.4);
  ctx.fillRect(6,-18,7,18+lo*0.4);
  ctx.fillRect(16,-18,7,18-lo*0.4);
  // head
  ctx.fillStyle = '#b5763a'; ctx.fillRect(14,-52,24,20);
  // snout
  ctx.fillStyle = '#8a5a2a'; ctx.fillRect(34,-46,12,10);
  ctx.fillStyle = '#222'; ctx.fillRect(42,-46,5,5); // nose
  // ear
  ctx.fillStyle = '#8a5a2a'; ctx.fillRect(16,-60,9,12);
  // eye
  ctx.fillStyle = '#222'; ctx.fillRect(28,-48,4,4);
  ctx.restore();
}

// ---------- LOOP ----------
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
fetchBoard();
loop();
</script>
</body>
</html>
